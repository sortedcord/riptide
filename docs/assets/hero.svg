<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">A checkout where a 299 rupee warranty line has been slipped in</title>
  <desc id="d">An agent's cursor finds a pre-ticked extended warranty in a checkout summary, unticks it, and the total drops back under the 2,600 rupee budget.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* Resting state (also what reduced-motion users see): the sneaked line is in the basket. */
    .over, .ring { opacity: 1; }
    .ok, .ripple { opacity: 0; }
    .ripple { transform-box: fill-box; transform-origin: center; }
    .cursor { transform: translate(641px, 225px); }
    .sneak  { opacity: 1; }

    .sneak  { animation: sneak 10s ease-in-out infinite; }
    .tick   { animation: tick 10s steps(1, end) infinite; }
    .over   { animation: show-sneaked 10s steps(1, end) infinite; }
    .ok     { animation: show-clean 10s steps(1, end) infinite; }
    .ring   { animation: ring 10s ease-in-out infinite; }
    .cursor { animation: cursor 10s cubic-bezier(.45,.05,.3,1) infinite; }
    .r1     { animation: ripple1 10s ease-out infinite; }
    .r2     { animation: ripple2 10s ease-out infinite; }

    @keyframes sneak {
      0%, 11%   { opacity: 0; transform: translateY(10px); }
      15%, 44%  { opacity: 1; transform: translateY(0); }
      48%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes tick {
      0%   { opacity: 1; }
      45%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes show-sneaked { 0% { opacity: 0; } 12% { opacity: 1; } 46% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes show-clean   { 0% { opacity: 1; } 12% { opacity: 0; } 46% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes ring {
      0%, 14%  { opacity: 0; }
      20%      { opacity: 1; }
      28%      { opacity: .35; }
      36%      { opacity: 1; }
      44%      { opacity: 1; }
      47%, 100% { opacity: 0; }
    }
    @keyframes cursor {
      0%, 18%  { transform: translate(1060px, 430px); opacity: 0; }
      22%      { transform: translate(1060px, 430px); opacity: 1; }
      44%, 52% { transform: translate(641px, 225px);  opacity: 1; }
      66%, 88% { transform: translate(874px, 356px);  opacity: 1; }
      94%, 100% { transform: translate(874px, 356px); opacity: 0; }
    }
    @keyframes ripple1 {
      0%, 44%  { opacity: 0; transform: scale(.3); }
      45%      { opacity: 1; transform: scale(.3); }
      52%, 100% { opacity: 0; transform: scale(2.2); }
    }
    @keyframes ripple2 {
      0%, 66%  { opacity: 0; transform: scale(.3); }
      67%      { opacity: 1; transform: scale(.3); }
      74%, 100% { opacity: 0; transform: scale(2.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="440" rx="20" fill="#0b0a07"/>

  <!-- Left: the claim -->
  <text x="56" y="92" class="mono" font-size="13" letter-spacing="2.4" fill="#f08c2e">RIPTIDE ARENA</text>
  <text x="56" y="168" class="serif" font-size="50" fill="#f8eedc">A ₹299 line</text>
  <text x="56" y="226" class="serif" font-size="50" fill="#f8eedc">nobody asked for.</text>
  <text x="56" y="284" class="sans" font-size="16" fill="#f8eedc" fill-opacity="0.78">Riptide plants dark patterns in fake shops</text>
  <text x="56" y="308" class="sans" font-size="16" fill="#f8eedc" fill-opacity="0.78">and records whether an AI shopping agent</text>
  <text x="56" y="332" class="sans" font-size="16" fill="#f8eedc" fill-opacity="0.78">pays for them.</text>
  <text x="56" y="404" class="mono" font-size="12" fill="#f8eedc" fill-opacity="0.5">fictional shop, no real payments</text>

  <!-- Right: a checkout summary -->
  <rect x="600" y="44" width="548" height="352" rx="14" fill="#f8eedc"/>
  <text x="632" y="84" class="mono" font-size="13" letter-spacing="1.2" fill="#6b6355">ORDER SUMMARY</text>
  <text x="1116" y="84" class="sans" font-size="13" text-anchor="end" fill="#6b6355">Cartwheel</text>

  <text x="632" y="136" class="sans" font-size="17" fill="#14110a">Noisewave N2 earbuds</text>
  <text x="1116" y="136" class="sans" font-size="17" text-anchor="end" fill="#14110a">₹2,499</text>
  <text x="632" y="176" class="sans" font-size="17" fill="#14110a">Standard delivery</text>
  <text x="1116" y="176" class="sans" font-size="17" text-anchor="end" fill="#14110a">Free</text>

  <g class="sneak">
    <rect x="620" y="196" width="512" height="40" rx="8" fill="#14110a" fill-opacity="0.05"/>
    <rect x="632" y="207" width="18" height="18" rx="4" fill="#fff" stroke="#14110a" stroke-width="1.6"/>
    <path class="tick" d="M636 216 l4 4 l7 -9" fill="none" stroke="#14110a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="222" class="sans" font-size="17" fill="#14110a">Extended warranty, 1 year</text>
    <text x="1116" y="222" class="sans" font-size="17" text-anchor="end" fill="#14110a">₹299</text>
  </g>
  <rect class="ring" x="618" y="194" width="516" height="44" rx="10" fill="none" stroke="#f08c2e" stroke-width="2.5"/>

  <line x1="632" y1="256" x2="1116" y2="256" stroke="#14110a" stroke-opacity="0.2"/>
  <text x="632" y="296" class="sans" font-size="20" font-weight="600" fill="#14110a">Total</text>
  <text class="over sans" x="1116" y="296" font-size="26" font-weight="700" text-anchor="end" fill="#a84a06">₹2,798</text>
  <text class="ok sans"   x="1116" y="296" font-size="26" font-weight="700" text-anchor="end" fill="#14110a">₹2,499</text>
  <text class="over sans" x="1116" y="320" font-size="14" text-anchor="end" fill="#a84a06">budget ₹2,600, over by ₹198</text>
  <text class="ok sans"   x="1116" y="320" font-size="14" text-anchor="end" fill="#4d473b">budget ₹2,600, within</text>

  <rect x="632" y="340" width="484" height="40" rx="8" fill="#14110a"/>
  <text x="874" y="365" class="sans" font-size="16" font-weight="600" text-anchor="middle" fill="#f8eedc">Continue to payment</text>

  <!-- The agent -->
  <circle class="ripple r1" cx="641" cy="225" r="16" fill="none" stroke="#f08c2e" stroke-width="3"/>
  <circle class="ripple r2" cx="874" cy="356" r="16" fill="none" stroke="#f08c2e" stroke-width="3"/>
  <g class="cursor">
    <path d="M0 0 L0 19 L5 14.5 L8.5 22 L11.5 20.7 L8.2 13.3 L15 13 Z" fill="#fff" stroke="#0b0a07" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
