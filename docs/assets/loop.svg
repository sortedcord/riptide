<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">The whole Riptide pipeline as a loop</title>
  <desc id="d">The stages run in a circuit: mutate, gates, build-suite, run, score, rate. A planned learn stage would turn ratings and gate failures into lessons in data/lessons, which the next mutate already reads. The learn stage is not built yet.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hl   { opacity: 0; animation: hl 14s ease-in-out infinite backwards; }
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes hl   { 0% { opacity: 0; } 2% { opacity: 1; } 8% { opacity: 1; } 11% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { display: none; } }
  </style>
  <defs>
    <marker id="ah"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f08c2e"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c8575"/></marker>
    <path id="circuit" d="M172 118 H1012 V378 H172 V118"/>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#0b0a07"/>
  <text x="56" y="44" class="mono" font-size="13" letter-spacing="1.8" fill="#f08c2e">ONE LAP, THEN BACK TO THE START</text>

  <path class="flow" d="M288 118 H332" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <path class="flow" d="M568 118 H612" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <path class="flow" d="M848 118 H892" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <path class="flow" d="M1012 166 V326" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <text x="1026" y="252" class="mono" font-size="13" fill="#f8eedc" fill-opacity="0.85">A2A</text>
  <path class="flow" d="M896 378 H852" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <path class="flow" d="M616 378 H572" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <path d="M336 378 H172 V268" fill="none" stroke="#8c8575" stroke-width="2" stroke-dasharray="3 6" marker-end="url(#ahg)"/>
  <text x="254" y="366" class="mono" font-size="13" text-anchor="middle" fill="#b3ab9a">planned</text>


  <!-- the token: orange where the step exists, grey across the part that does not -->
  <circle class="dot" r="7" fill="#f08c2e">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="paced"><mpath href="#circuit"/></animateMotion>
    <animate attributeName="fill" dur="14s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.627;0.628;0.941;0.942;1"
      values="#f08c2e;#f08c2e;#8c8575;#8c8575;#f08c2e;#f08c2e"/>
  </circle>


  <g>
    <rect x="56" y="70" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:-0.42s" x="56" y="70" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="74" y="104" class="mono" font-size="19" font-weight="700" fill="#f8eedc">mutate</text>
    
    <text x="74" y="131" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">Trickster edits one shop</text>
    <text x="74" y="151" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">data/mutations, data/tasks</text>
  </g>
  <g>
    <rect x="336" y="70" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:1.36s" x="336" y="70" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="354" y="104" class="mono" font-size="19" font-weight="700" fill="#f8eedc">gates</text>
    
    <text x="354" y="131" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">scope, build, smoke, verify</text>
    <text x="354" y="151" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">data/gates</text>
  </g>
  <g>
    <rect x="616" y="70" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:3.14s" x="616" y="70" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="634" y="104" class="mono" font-size="19" font-weight="700" fill="#f8eedc">build-suite</text>
    
    <text x="634" y="131" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">freeze variants + controls</text>
    <text x="634" y="151" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">data/suites, data/rubrics</text>
  </g>
  <g>
    <rect x="896" y="70" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:4.93s" x="896" y="70" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="914" y="104" class="mono" font-size="19" font-weight="700" fill="#f8eedc">run</text>
    
    <text x="914" y="131" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">task over A2A to a sniffer</text>
    <text x="914" y="151" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">data/runs, data/recorder</text>
  </g>
  <g>
    <rect x="896" y="330" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:6.58s" x="896" y="330" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="914" y="364" class="mono" font-size="19" font-weight="700" fill="#f8eedc">score</text>
    
    <text x="914" y="391" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">recorder events vs rubric</text>
    <text x="914" y="411" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">score.json per run</text>
  </g>
  <g>
    <rect x="616" y="330" width="232" height="96" rx="12" fill="#211e17" stroke="#f8eedc" stroke-opacity="0.22"/>
    <rect class="hl" style="animation-delay:8.36s" x="616" y="330" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="634" y="364" class="mono" font-size="19" font-weight="700" fill="#f8eedc">rate</text>
    
    <text x="634" y="391" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">sub-scores, 0 to 100, stars</text>
    <text x="634" y="411" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">data/ratings</text>
  </g>
  <g>
    <rect x="336" y="330" width="232" height="96" rx="12" fill="#211e17" stroke="#8c8575" stroke-opacity="0.9" stroke-dasharray="6 5"/>
    <rect class="hl" style="animation-delay:10.14s" x="336" y="330" width="232" height="96" rx="12" fill="none" stroke="#f08c2e" stroke-width="2.5"/>
    <text x="354" y="364" class="mono" font-size="19" font-weight="700" fill="#f8eedc">learn</text>
    <text x="552" y="360" class="mono" font-size="12" text-anchor="end" fill="#b3ab9a">not built yet</text>
    <text x="354" y="391" class="sans" font-size="14" fill="#f8eedc" fill-opacity="0.78">ratings and gate failures</text>
    <text x="354" y="411" class="mono" font-size="12.5" fill="#f8eedc" fill-opacity="0.55">become lessons</text>
  </g>

  <rect x="92" y="236" width="160" height="32" rx="16" fill="#211e17" stroke="#8c8575" stroke-dasharray="4 4"/>
  <text x="172" y="257" class="mono" font-size="13" text-anchor="middle" fill="#f8eedc" fill-opacity="0.85">data/lessons</text>
  <path class="flow" d="M172 236 V170" fill="none" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <text x="184" y="206" class="mono" font-size="13" fill="#f8eedc" fill-opacity="0.85">next mutate reads the</text>
  <text x="184" y="224" class="mono" font-size="13" fill="#f8eedc" fill-opacity="0.85">newest file (built)</text>

  <g class="mono" font-size="13">
    <line x1="56" y1="486" x2="92" y2="486" stroke="#f08c2e" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="104" y="491" fill="#f8eedc" fill-opacity="0.8">built and wired</text>
    <line x1="296" y1="486" x2="332" y2="486" stroke="#8c8575" stroke-width="2" stroke-dasharray="3 6"/>
    <text x="344" y="491" fill="#f8eedc" fill-opacity="0.8">not built yet</text>
  </g>
</svg>
